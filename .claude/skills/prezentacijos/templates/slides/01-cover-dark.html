<!-- ========================================================================
     COVER SLIDE (DARK) - opening slide for the deck
     Svarus virselis: logotipas virsuje kaireje, antraste ir paantraste.
     Jokiu datu, porasciu ar kontaktu kampuose (svaru pagal nutylejima).
     CUSTOMIZE:
       - Logotipas / pavadinimas virsuje kaireje (tik virselyje ir pabaigoje)
       - Title with ONE italic accent word (orange-light) - mandatory padding-right on italic
       - Subtitle (short, one line about the offer)
     ======================================================================== -->
<section class="slide" style="background: linear-gradient(135deg, #24303F 0%, #171F2A 100%);">
  <div class="absolute inset-0 glow-orange-hero"></div>
  <div class="absolute inset-0 glow-orange-corner opacity-40"></div>
  <div class="absolute inset-0 grain pointer-events-none"></div>

  <div class="relative z-10 h-full flex flex-col" style="padding: 100px 120px;">
    <!-- Logotipas virsuje kaireje (tik virselyje ir pabaigoje) -->
    <div class="font-display font-bold text-white" style="font-size: 30px; letter-spacing: -0.02em;">[Įmonės pavadinimas / logotipas]</div>

    <!-- Hero, centruotas su oru is virsaus ir apacios -->
    <div class="flex-1 flex flex-col justify-center">
      <h1 class="font-display font-bold text-white" style="font-size: 108px; line-height: 0.94; letter-spacing: -0.035em;">
        [Pirma&nbsp;eilutė]<br>su <span class="text-orange-light italic font-normal" style="font-style: italic; padding-right: 0.18em;">[akcentu]</span> [tęsinys]
      </h1>
      <p class="text-white/75 mt-12" style="font-size: 26px; line-height: 1.45; max-width: 1000px; font-weight: 300;">
        [Vienos eilutės pažadas, ką šita prezentacija duoda. Daugiausiai 2 sakiniai.]
      </p>
    </div>
  </div>

</section>
