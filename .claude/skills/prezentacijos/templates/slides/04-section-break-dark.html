<!-- ========================================================================
     SECTION-BREAK-DARK - big title section divider with optional preview strip
     Best for: "The approach" / "Part 1" / "Methodology" / major act transitions
     CUSTOMIZE:
       - Top-right eyebrow
       - Accent eyebrow ("METHODOLOGY", "PART ONE", etc.)
       - Giant title with ONE italic orange-light word
       - Subtitle (1-2 sentences)
       - Optional bottom preview strip (can be removed if not needed)
     ======================================================================== -->
<section class="slide" style="background: linear-gradient(135deg, #171F2A 0%, #24303F 55%, #171F2A 100%);">
  <div class="absolute inset-0 glow-orange-hero opacity-70"></div>
  <div class="absolute inset-0 glow-orange-corner opacity-35"></div>
  <div class="absolute inset-0 grain pointer-events-none"></div>

  <div class="relative z-10 h-full flex flex-col" style="padding: 100px 120px;">

    <!-- Centered hero -->
    <div class="flex-1 flex flex-col justify-center">
      <div class="flex items-center gap-5 mb-10">
        <div class="accent-bar" style="background: #F6E2D5;"></div>
        <div class="font-mono text-white/60 text-[14px] uppercase" style="letter-spacing: 0.3em;">[Accent eyebrow]</div>
      </div>
      <h1 class="font-display font-bold text-white" style="font-size: 120px; line-height: 0.94; letter-spacing: -0.035em;">
        [First line]<br>[pre]&nbsp;<span class="text-orange-light italic font-normal" style="padding-right: 0.05em;">[ITALIC]</span>[.]
      </h1>
      <p class="text-white/75 mt-12 max-w-[1200px]" style="font-size: 28px; line-height: 1.45; font-weight: 300;">
        [Subtitle - sets up what follows. 1-2 sentences.]
      </p>
    </div>

    <!-- OPTIONAL: Bottom preview strip (delete if not needed) -->
    <div class="pt-8 border-t hairline-dark">
      <div class="flex justify-between items-center">
        <div class="font-mono text-white/40 text-[12px] uppercase" style="letter-spacing: 0.25em;">[Left label - e.g. "Five layers · one sequence"]</div>
        <div class="flex items-center gap-10">
          <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-orange-light"></div><span class="font-mono text-white/70 text-[12px] uppercase" style="letter-spacing: 0.2em;">01 [Item]</span></div>
          <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-orange-light/75"></div><span class="font-mono text-white/60 text-[12px] uppercase" style="letter-spacing: 0.2em;">02 [Item]</span></div>
          <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-orange-light/55"></div><span class="font-mono text-white/55 text-[12px] uppercase" style="letter-spacing: 0.2em;">03 [Item]</span></div>
          <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-orange-light/40"></div><span class="font-mono text-white/50 text-[12px] uppercase" style="letter-spacing: 0.2em;">04 [Item]</span></div>
          <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-orange-light/25"></div><span class="font-mono text-white/45 text-[12px] uppercase" style="letter-spacing: 0.2em;">05 [Item]</span></div>
        </div>
      </div>
    </div>
  </div>

</section>
