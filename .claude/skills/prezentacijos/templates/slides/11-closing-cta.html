<!-- ========================================================================
     CLOSING-CTA - dark gradient closing slide (no photo version)
     Best for: final CTA when no hero photo is available
     Svaru: logotipas virsuje kaireje, be datu/tag prirasiuku.
     CUSTOMIZE:
       - Logotipas / pavadinimas virsuje kaireje
       - Eyebrow (accent-bar kikeris hero bloke)
       - Big title + italic accent
       - Subtitle
       - CTA - el. pastas ir nuoroda (svarbi pabaigos skaidres dalis)
     ======================================================================== -->
<section class="slide" style="background: linear-gradient(135deg, #171F2A 0%, #24303F 55%, #171F2A 100%);">
  <div class="absolute inset-0 glow-orange-hero opacity-75"></div>
  <div class="absolute inset-0 glow-orange-corner opacity-40"></div>
  <div class="absolute inset-0 grain pointer-events-none"></div>

  <div class="relative z-10 h-full flex flex-col" style="padding: 100px 120px;">
    <!-- Logotipas virsuje kaireje (tik virselyje ir pabaigoje) -->
    <div class="font-display font-bold text-white" style="font-size: 22px; letter-spacing: -0.02em;">[Įmonės pavadinimas / logotipas]</div>

    <!-- Centered hero -->
    <div class="flex-1 flex flex-col justify-center" style="max-width: 1100px;">
      <div class="flex items-center gap-5 mb-10">
        <div class="accent-bar" style="background: #F6E2D5;"></div>
        <div class="font-mono text-white/65 text-[14px] uppercase" style="letter-spacing: 0.3em;">[Etiketė, pavyzdžiui "Pasikalbėkim"]</div>
      </div>
      <h1 class="font-display font-bold text-white" style="font-size: 104px; line-height: 0.94; letter-spacing: -0.035em;">
        [Pirma eilutė.]<br>
        <span class="text-orange-light italic font-normal" style="padding-right: 0.12em;">[Kursyvinis&nbsp;akcentas]</span>.
      </h1>
      <p class="text-white/80 mt-10" style="font-size: 26px; line-height: 1.45; font-weight: 300; max-width: 900px;">
        [Paantraštė, 1 arba 2 sakiniai, kviečiantys pokalbiui.]
      </p>
    </div>

    <!-- Bottom: CTA -->
    <div class="flex justify-between items-end">
      <div>
        <div class="font-mono text-white/55 text-[12px] uppercase mb-2" style="letter-spacing: 0.28em;">[Susisiek]</div>
        <div class="font-display font-bold text-white" style="font-size: 36px; letter-spacing: -0.02em;">[el. paštas]</div>
        <div class="font-body text-white/55 text-[15px] mt-2">[nuoroda arba telefonas]</div>
      </div>
    </div>
  </div>

</section>
