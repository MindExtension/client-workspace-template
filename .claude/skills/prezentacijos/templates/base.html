<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <title>Prezentacija</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // SPALVOS: numatytoji neutrali paletė, pakeisk į kliento firmines spalvas.
    // Pilnas aprašas: references/firminis-stilius.md. Keisk hex reikšmes čia (ir tik
    // čia), klasės skaidrėse liks tos pačios. cream = šviesus fonas, navy = tamsus indigo
    // fonas, orange = akcento spalva.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F7F5F1',
            offwhite: '#FDFCFA',
            navy: '#24303F',
            'navy-deep': '#171F2A',
            orange: '#C65D2A',
            'orange-dark': '#A34A20',
            'orange-light': '#F6E2D5',
            ink: '#1B1B1B',
          },
          fontFamily: {
            display: ['"InstrumentSans"', 'sans-serif'],
            body: ['"WorkSans"', 'sans-serif'],
            mono: ['"DMMono"', 'monospace'],
          },
        }
      }
    };
  </script>
  <!-- Schemos (procesai, medžiai, sekos) piešiamos Mermaid varikliu. Naudok <pre class="mermaid"> bloką. -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#F6E2D5',
        primaryTextColor: '#1B1B1B',
        primaryBorderColor: '#C65D2A',
        lineColor: '#C65D2A',
        fontFamily: 'WorkSans, sans-serif',
        fontSize: '22px',
      },
      flowchart: { curve: 'basis' },
    });
  </script>
  <style>
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./fonts/InstrumentSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'InstrumentSans';
      src: url('./fonts/InstrumentSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'WorkSans';
      src: url('./fonts/WorkSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'WorkSans';
      src: url('./fonts/WorkSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'DMMono';
      src: url('./fonts/DMMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { margin: 0; background: #222; font-family: 'WorkSans', sans-serif; }
    .slide {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      margin: 20px auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    .glow-orange-hero {
      background: radial-gradient(ellipse 70% 55% at 50% 50%, rgba(231,31,100,0.5) 0%, rgba(231,31,100,0.22) 35%, transparent 70%);
    }
    .glow-orange-sm {
      background: radial-gradient(circle at 50% 50%, rgba(231,31,100,0.32), transparent 65%);
    }
    .glow-orange-corner {
      background: radial-gradient(ellipse 60% 70% at 100% 100%, rgba(231,31,100,0.4) 0%, transparent 60%);
    }
    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      opacity: 0.12;
      mix-blend-mode: overlay;
    }
    .hairline-light { border-color: rgba(22,22,22,0.08); }
    .hairline-dark { border-color: rgba(252,251,249,0.12); }
    .card-shadow {
      box-shadow: 0 1px 2px rgba(22,22,22,0.04), 0 8px 24px rgba(22,22,22,0.06);
    }
    .card-shadow-lg {
      box-shadow: 0 2px 4px rgba(22,22,22,0.06), 0 16px 40px rgba(22,22,22,0.08);
    }
    .accent-bar {
      width: 4px;
      height: 48px;
      background: #C65D2A;
      border-radius: 2px;
    }
    /* skaidres numeris: pagal nutylejima NENAUDOJAM (svarus vaizdas be prirasiuku).
       Dedam tik jei zmogus aiskiai prasys numeriu. Zr. references/firminis-stilius.md */
    .slide-number {
      position: absolute;
      bottom: 48px;
      right: 48px;
      font-family: 'DMMono', monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    /* Mermaid schemos skaidrėje: SVG užpildo visą bloką išlaikydamas proporcijas */
    .diagram-box { display: flex; align-items: center; justify-content: center; }
    .diagram-box pre.mermaid { margin: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .diagram-box svg { width: 100%; height: 100%; max-width: none !important; }
    /* Paprasti stulpeliniai grafikai be jokių bibliotekų: .bar aukštis procentais */
    .bar-chart { display: flex; align-items: flex-end; gap: 32px; height: 100%; }
    .bar-chart .bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; flex: 1; }
    .bar-chart .bar { width: 100%; background: #C65D2A; border-radius: 8px 8px 0 0; }
    .bar-chart .bar.muted { background: rgba(22,22,22,0.15); }
  </style>
</head>
<body>

  <!-- ============================================================
       SKAIDRĖS DEDAMOS ČIA
       Kopijuok "section class=slide" blokus iš templates/slides/*.html
       ir keisk [pažymėtas] vietas.
       Prieš kiekvieną skaidrę palik HTML komentarą, prasidedantį
       "===== NN " (NN yra skaidrės numeris 01, 02, ...), pagal jį
       veikia skaidymo skriptas split-slides.mjs.
       ============================================================ -->

</body>
</html>
